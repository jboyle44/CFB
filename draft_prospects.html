<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 NFL Draft Prospects</title>
<style>
  :root{
    --bg:#15161A; --panel:#1B1D22; --panel-2:#202329; --line:#2C2F36;
    --text:#EDEAE2; --text-dim:#9CA0A8; --text-faint:#6B6F78;
    --gold:#C9A227; --gold-dim:#8C7420;
    --blue:#6FA8DC; --red:#D46A6A;
    --draft:#87CEEB; --draft-dim:#4A90A4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:20px 16px 60px;}
  .topbar{
    display:flex; justify-content:space-between; align-items:flex-start;
    flex-wrap:wrap; gap:16px; margin-bottom:16px;
  }
  .brand h1{font-size:22px; margin:0 0 4px; letter-spacing:0.02em;}
  .brand .accent{color:var(--draft);}
  .brand .sub{font-size:12px; color:var(--text-faint);}
  .nav-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .serif-i{font-family:Georgia,'Times New Roman',Times,serif;}
  .nav-btn{
    text-decoration:none; margin-left:6px; background:transparent;
    border:1px solid var(--gold-dim); border-radius:6px; padding:9px 14px;
    font-size:13px; font-weight:600; display:inline-block; color:var(--gold);
  }
  .btn-cfb{
    background:linear-gradient(90deg, #4CAF50, #8E44AD) !important;
    -webkit-background-clip:text !important; background-clip:text !important;
    -webkit-text-fill-color:transparent !important; color:transparent !important;
    border-color:#5C4070;
  }
  .btn-nfl{
    background:linear-gradient(90deg, #4A90D9, #E63946) !important;
    -webkit-background-clip:text !important; background-clip:text !important;
    -webkit-text-fill-color:transparent !important; color:transparent !important;
    border-color:#3D5A80;
  }
  .status-row{
    display:flex; align-items:center; gap:8px; font-size:12px;
    color:var(--text-faint); margin-bottom:16px; flex-wrap:wrap;
  }
  .dot{width:8px; height:8px; border-radius:50%; background:#5A9A5A; display:inline-block;}
  .filters{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .filters input, .filters select{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:6px; font-size:13px;
  }
  .filters input{flex:1; min-width:180px;}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--panel);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; padding:10px 12px; background:var(--panel-2);
    color:var(--text-dim); font-weight:600; font-size:11px; text-transform:uppercase;
    letter-spacing:0.03em; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  tbody td{padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--panel-2);}
  .rank{color:var(--text-dim); font-weight:700; width:40px;}
  .pos{color:var(--gold); font-weight:600;}
  .empty{padding:40px; text-align:center; color:var(--text-faint);}
</style>

// Same treatment as BRR's school-name badges: solid primary-color
// background with white text, secondary color as a border accent.
// Applied here to the PLAYER'S name (using their school's colors), not the
// school name itself, per request.
function coloredName(playerName, schoolName){
  const c = TEAM_COLORS[schoolName];
  if(!c) return playerName;
  return `<span style="background:${c.primary}; color:#fff; padding:1px 7px; border-radius:4px; border:2px solid ${c.secondary}; font-weight:700; white-space:nowrap; display:inline-block;">${playerName}</span>`;
}

let DATA = [];
let state = { search: "", position: "" };

function fmtTimestamp(iso){
  if(!iso) return null;
  const d = new Date(iso);
  return d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}

async function loadData(){
  try{
    const res = await fetch('draft_prospects.json?v=' + Date.now());
    const raw = await res.json();
    DATA = raw.prospects || [];
    const ts = fmtTimestamp(raw.generatedAt);
    document.getElementById('statusText').textContent = DATA.length
      ? `${DATA.length} prospects · updated ${ts || 'recently'}`
      : 'No data available yet';
  } catch(e){
    document.getElementById('statusText').textContent = 'Failed to load data';
    document.getElementById('statusDot').style.background = '#D46A6A';
  }
  init();
}

function init(){
  const posSelect = document.getElementById('posSelect');
  const positions = [...new Set(DATA.map(p => p.position).filter(Boolean))].sort();
  positions.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = p;
    posSelect.appendChild(opt);
  });

  document.getElementById('searchBox').addEventListener('input', (e) => {
    state.search = e.target.value.toLowerCase();
    render();
  });
  posSelect.addEventListener('change', (e) => {
    state.position = e.target.value;
    render();
  });

  render();
}

function render(){
  const tbody = document.getElementById('tbody');
  const emptyState = document.getElementById('emptyState');
  const q = state.search;

  const rows = DATA.filter(p => {
    if(state.position && p.position !== state.position) return false;
    if(q && !(p.name.toLowerCase().includes(q) || (p.school || '').toLowerCase().includes(q))) return false;
    return true;
  });

  if(!rows.length){
    tbody.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  tbody.innerHTML = rows.map(p => `
    <tr>
      <td class="rank">${p.rank}</td>
      <td>${coloredName(p.name, p.school)}</td>
      <td class="pos">${p.position || '—'}</td>
      <td>${p.school || '—'}</td>
      <td>${p.class || '—'}</td>
      <td>${p.height || '—'}</td>
      <td>${p.weight ? p.weight + ' lbs' : '—'}</td>
    </tr>`).join('');
}

loadData();
