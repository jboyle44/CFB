<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFB Depth Charts</title>
<style>
  :root{
    --bg:#15161A; --panel:#1B1D22; --panel-2:#202329; --line:#2C2F36;
    --text:#EDEAE2; --text-dim:#9CA0A8; --text-faint:#6B6F78;
    --gold:#C9A227; --gold-dim:#8C7420;
    --blue:#6FA8DC; --red:#D46A6A; --purple:#B48EAD;
    --green-bg:rgba(90,160,90,0.14); --red-bg:rgba(212,106,106,0.14);
  }
  *{box-sizing:border-box;}
  .serif-i{font-family:Georgia,'Times New Roman',Times,serif;}
  .dc-accent{
    color:#F4D03F;
    text-shadow:1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
  }
  .nav-btn{
    text-decoration:none; margin-left:6px; background:transparent;
    border:1px solid var(--gold-dim); border-radius:6px; padding:9px 14px;
    font-size:13px; font-weight:600; display:inline-block; color:var(--gold);
  }
  .btn-cfb{
    background:linear-gradient(90deg, #4CAF50, #8E44AD) !important;
    -webkit-background-clip:text !important; background-clip:text !important;
    -webkit-text-fill-color:transparent !important; color:transparent !important;
    border-color:#8E44AD !important;
  }
  .btn-nfl{
    background:linear-gradient(90deg, #4A90D9, #E63946) !important;
    -webkit-background-clip:text !important; background-clip:text !important;
    -webkit-text-fill-color:transparent !important; color:transparent !important;
    border-color:#E63946 !important;
  }
  .btn-brr{ color:var(--gold); }
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    padding:28px 20px 60px;
  }
  .wrap{max-width:1040px;margin:0 auto;}
  .topbar{
    display:flex; justify-content:space-between; align-items:flex-end;
    flex-wrap:wrap; gap:16px;
    padding-bottom:18px; margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:baseline; gap:12px;}
  .brand h1{font-size:26px; font-weight:800; letter-spacing:-0.02em; margin:0; color:var(--text);}
  .brand .sub{font-size:13px; color:var(--text-faint); letter-spacing:0.02em;}
  .nav-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  select{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:8px 10px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .status-row{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-faint); margin-bottom:18px; flex-wrap:wrap;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex-shrink:0;}
  .dot.ok{background:#7FB27F;}
  .dot.warn{background:var(--gold);}

  .filters{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .filters input[type=text]{
    flex:1; min-width:180px;
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:9px 12px; font-size:14px;
  }
  .filters input::placeholder{color:var(--text-faint);}
  .legend{display:flex; gap:14px; font-size:11.5px; color:var(--text-faint); margin-bottom:16px; flex-wrap:wrap;}
  .legend span.sw{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:middle;}
  .sw.tr{background:var(--purple);}
  .sw.fr{background:var(--blue);}

  .pos-group{margin-bottom:22px; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .pos-group h3{
    margin:0; padding:12px 16px; background:var(--panel-2); font-size:14px;
    color:var(--gold); border-bottom:1px solid var(--line); letter-spacing:0.02em;
  }
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; font-size:10.5px; font-weight:600; color:var(--text-faint);
    padding:9px 12px; background:var(--panel); border-bottom:1px solid var(--line);
    white-space:nowrap; text-transform:uppercase; letter-spacing:0.03em;
  }
  thead th.num{text-align:right;}
  tbody td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle; background:var(--panel);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:var(--panel-2);}
  td.num{text-align:right; font-variant-numeric:tabular-nums; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px;}
  td.player{font-weight:600;}
  td.player a{color:var(--text); text-decoration:none;}
  td.player a:hover{color:var(--gold);}
  .badge{
    display:inline-block; font-size:9.5px; font-weight:700; padding:2px 6px;
    border-radius:4px; margin-left:6px; vertical-align:middle;
  }
  .badge.tr{background:rgba(180,142,173,0.18); color:var(--purple);}
  .badge.fr{background:rgba(111,168,220,0.18); color:var(--blue);}
  .rank-slot{color:var(--text-faint); font-size:11px;}
  .pending{color:var(--text-faint); font-style:italic; font-size:12px;}
  .empty{padding:40px; text-align:center; color:var(--text-faint);}

  @media (max-width:640px){
    thead th{padding:7px 6px; font-size:9.5px;}
    tbody td{padding:7px 6px; font-size:12.5px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <h1>CFB Depth <span class="dc-accent">Charts</span></h1>
      <span class="sub">Ourlads depth chart &nbsp;·&nbsp; 247Sports recruiting &amp; transfer ranks &nbsp;·&nbsp; PFF grades (coming soon)</span>
    </div>
    <div class="nav-row">
      <select id="teamSelect"></select>
      <a href="./index.html" class="nav-btn btn-brr">BRR</a>
      <a href="./lines.html" class="nav-btn btn-cfb">DF<span class="serif-i">I</span>-CFB</a>
      <a href="./lines_nfl.html" class="nav-btn btn-nfl">DF<span class="serif-i">I</span>-NFL</a>
    </div>
  </div>

  <div class="status-row">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Loading…</span>
  </div>

  <div class="filters">
    <input type="text" id="searchBox" placeholder="Search player…">
  </div>

  <div class="legend">
    <span><span class="sw tr"></span>Transfer</span>
    <span><span class="sw fr"></span>True Freshman</span>
  </div>

  <div id="chartBody"></div>
  <div class="empty" id="emptyState" style="display:none;">No players match your search.</div>

</div>

<script>
let DATA = { team: null, rows: [] };
const POS_ORDER = ["WR-X","WR-Z","WR-SL","LT","LG","C","RG","RT","TE","QB","RB",
  "LDE","NT","DT","RDE","WLB","MLB","LCB","SS","FS","RCB","NB",
  "PT","PK","KO","LS","H","PR","KR"];

async function loadData(){
  const res = await fetch('depth_chart_data.json?v=' + Date.now());
  const raw = await res.json();
  DATA = raw;
  init();
}

function fmtTimestamp(iso){
  if(!iso) return null;
  const d = new Date(iso);
  if(isNaN(d.getTime())) return null;
  const datePart = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const timePart = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  return `${datePart}, ${timePart}`;
}

function renderStatus(){
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  if(!DATA.rows || !DATA.rows.length){
    dot.className = 'dot warn';
    statusText.textContent = 'No data loaded yet.';
    return;
  }
  dot.className = 'dot ok';
  const ts = fmtTimestamp(DATA.generatedAt);
  const parts = [`${DATA.team || 'Team'} · ${DATA.rows.length} depth chart spots`];
  if(ts) parts.push(`updated ${ts}`);
  statusText.textContent = parts.join(' · ');
}

let state = { search: "" };
const searchBox = document.getElementById("searchBox");

function init(){
  renderStatus();
  searchBox.addEventListener("input", () => { state.search = searchBox.value.toLowerCase(); render(); });
  render();
}

function rankCell(row){
  if(row.isTransfer){
    if(row.transferRank != null){
      return `<div>Transfer <span class="num" style="font-weight:700;">#${row.transferRank}</span> <span class="rank-slot">(POS #${row.transferPosRank ?? '—'})</span></div>
              <div class="rank-slot">HS: #${row.hsNationalRank ?? '—'} natl</div>`;
    }
    return `<span class="pending">transfer rank pending update</span>`;
  }
  if(row.hsNationalRank != null){
    return `<div>#${row.hsNationalRank} natl <span class="rank-slot">(POS #${row.hsPositionRank ?? '—'}, ${row.hsStateRank ? '#'+row.hsStateRank+' state' : ''})</span></div>`;
  }
  return `<span class="rank-slot">—</span>`;
}

function render(){
  const q = state.search;
  const rows = DATA.rows.filter(r => !q || r.player.toLowerCase().includes(q));
  const container = document.getElementById("chartBody");
  const emptyState = document.getElementById("emptyState");

  if(!rows.length){
    container.innerHTML = "";
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";

  const groups = {};
  rows.forEach(r => { (groups[r.position] = groups[r.position] || []).push(r); });

  const orderedPositions = Object.keys(groups).sort((a,b) => {
    const ai = POS_ORDER.indexOf(a), bi = POS_ORDER.indexOf(b);
    return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
  });

  container.innerHTML = orderedPositions.map(pos => {
    const list = groups[pos];
    const rowsHtml = list.map(r => {
      const badge = r.isTransfer ? '<span class="badge tr">TR</span>'
                  : r.class && r.class.toUpperCase() === 'FR' ? '<span class="badge fr">FR</span>' : '';
      const nameCell = r.profileUrl
        ? `<a href="${r.profileUrl}" target="_blank" rel="noopener">${r.player}</a>`
        : r.player;
      return `
        <tr>
          <td class="num">${r.jersey || ''}</td>
          <td class="player">${nameCell}${badge}</td>
          <td>${r.class || ''}</td>
          <td class="num">${r.compositeScore ?? '—'}</td>
          <td>${rankCell(r)}</td>
          <td class="pending">pending PFF export</td>
        </tr>`;
    }).join('');
    return `
      <div class="pos-group">
        <h3>${pos}</h3>
        <table>
          <thead>
            <tr>
              <th class="num">No.</th>
              <th>Player</th>
              <th>Class</th>
              <th class="num">247 Composite</th>
              <th>Recruiting / Transfer Rank</th>
              <th>PFF Grade</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>`;
  }).join('');
}

loadData();
</script>
</body>
</html>
