<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFB Depth Charts</title>
<style>
  :root{
    --bg:#15161A; --panel:#1B1D22; --panel-2:#202329; --line:#2C2F36;
    --text:#EDEAE2; --text-dim:#9CA0A8; --text-faint:#6B6F78;
    --gold:#C9A227; --gold-dim:#8C7420;
    --blue:#6FA8DC; --red:#D46A6A; --purple:#B48EAD;
    --box-header:#101114;
  }
  *{box-sizing:border-box;}
  .serif-i{font-family:Georgia,'Times New Roman',Times,serif;}
  .dc-accent{
    color:#F4D03F;
    text-shadow:1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
  }
  .nav-btn{
    text-decoration:none; margin-left:6px; background:transparent;
    border:1px solid var(--gold-dim); border-radius:6px; padding:9px 14px;
    font-size:13px; font-weight:600; display:inline-block; color:var(--gold);
  }
  .btn-cfb{
    background:linear-gradient(90deg, #4CAF50, #8E44AD) !important;
    -webkit-background-clip:text !important; background-clip:text !important;
    -webkit-text-fill-color:transparent !important; color:transparent !important;
    border-color:#8E44AD !important;
  }
  .btn-nfl{
    background:linear-gradient(90deg, #4A90D9, #E63946) !important;
    -webkit-background-clip:text !important; background-clip:text !important;
    -webkit-text-fill-color:transparent !important; color:transparent !important;
    border-color:#E63946 !important;
  }
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    padding:28px 20px 60px;
  }
  .wrap{max-width:1100px;margin:0 auto;}
  .topbar{
    display:flex; justify-content:space-between; align-items:flex-end;
    flex-wrap:wrap; gap:16px;
    padding-bottom:18px; margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:baseline; gap:12px;}
  .brand h1{font-size:24px; font-weight:800; letter-spacing:-0.02em; margin:0; color:var(--text);}
  .brand .sub{font-size:12.5px; color:var(--text-faint); letter-spacing:0.02em;}
  .nav-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  select{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:8px 10px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .status-row{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-faint); margin-bottom:16px; flex-wrap:wrap;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex-shrink:0;}
  .dot.ok{background:#7FB27F;}
  .dot.warn{background:var(--gold);}

  .filters{margin-bottom:18px;}
  .filters input[type=text]{
    width:100%; max-width:320px;
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:9px 12px; font-size:14px;
  }
  .filters input::placeholder{color:var(--text-faint);}

  .legend{display:flex; gap:16px; font-size:11px; color:var(--text-faint); margin-bottom:20px; flex-wrap:wrap;}
  .legend span.sw{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:middle;}
  .sw.tr{background:var(--purple);}
  .sw.fr{background:var(--blue);}

  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    margin:26px 0 12px; padding-bottom:8px; border-bottom:2px solid var(--line);
  }
  .section-head h2{font-size:19px; margin:0; letter-spacing:0.02em;}
  .section-head .scheme{font-size:12px; color:var(--text-faint); font-weight:600;}

  .formrow{
    display:grid; gap:8px; margin-bottom:8px;
  }

  .posbox{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    overflow:hidden; min-width:0;
  }
  .posbox .hd{
    background:var(--box-header); color:var(--gold); text-align:center;
    font-weight:800; font-size:11px; letter-spacing:0.03em; padding:4px 4px;
    border-bottom:1px solid var(--line);
  }
  .slot{padding:3px 6px; border-bottom:1px solid var(--line);}
  .slot:last-child{border-bottom:none;}
  .slot.starter{background:rgba(201,162,39,0.06);}
  .slot .l1{
    font-size:11.5px; font-weight:700; display:flex; align-items:center; gap:4px;
    flex-wrap:wrap; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .slot.starter .l1{font-size:12px;}
  .slot:not(.starter) .l1{font-weight:600; color:var(--text-dim); font-size:11px;}
  .slot .num{color:var(--text-faint); font-weight:600; font-variant-numeric:tabular-nums;}
  .slot .l2{font-size:9px; color:var(--text-faint); margin-top:1px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .slot .l3{font-size:9px; color:var(--text-faint); margin-top:0; line-height:1.3;}
  .slot .pff{color:var(--text-faint); font-style:italic;}
  .badge{
    display:inline-block; font-size:8.5px; font-weight:800; padding:1px 5px;
    border-radius:3px; vertical-align:middle;
  }
  .badge.tr{background:rgba(180,142,173,0.2); color:var(--purple);}
  .badge.fr{background:rgba(111,168,220,0.2); color:var(--blue);}
  .empty{padding:40px; text-align:center; color:var(--text-faint);}

  @media (max-width:640px){
    .posbox{width:104px;}
    .slot{padding:6px 6px;}
    .slot .l1{font-size:11.5px;}
    .slot .l2, .slot .l3{font-size:9px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <h1>CFB Depth <span class="dc-accent">Charts</span></h1>
      <span class="sub">Ourlads depth chart &nbsp;·&nbsp; 247Sports recruiting/transfer &nbsp;·&nbsp; PFF grade (coming soon)</span>
    </div>
    <div class="nav-row">
      <select id="teamSelect"></select>
      <a href="./index.html" class="nav-btn" style="color:var(--gold);">BRR</a>
      <a href="./lines.html" class="nav-btn btn-cfb">DF<span class="serif-i">I</span>-CFB</a>
      <a href="./lines_nfl.html" class="nav-btn btn-nfl">DF<span class="serif-i">I</span>-NFL</a>
    </div>
  </div>

  <div class="status-row">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Loading…</span>
  </div>

  <div class="filters">
    <input type="text" id="searchBox" placeholder="Search player…">
  </div>

  <div class="legend">
    <span><span class="sw tr"></span>Transfer</span>
    <span><span class="sw fr"></span>True Freshman</span>
  </div>

  <div id="chartBody"></div>
  <div class="empty" id="emptyState" style="display:none;">No players match your search.</div>

</div>

<script>
let DATA = { team: null, rows: [] };

// Formation rows. Each row: { cols: N, items: [...] }
// items are either a plain position code (auto-centered across the row)
// or {pos, col} to pin it at an exact grid column (1-indexed).
const DEFENSE_ROWS = [
  { cols:5, items:["FS","SS"] },                      // deep secondary, centered
  { cols:5, items:["LCB","WLB","MLB","NB","RCB"] },    // corners + backers + nickel, full width
  { cols:5, items:["LDE","NT","DT","RDE"] }            // D-line, centered
];
const OFFENSE_ROWS = [
  { cols:7, items:["WR-X","LT","LG","C","RG","RT","WR-Z"] }, // O-line + outside WRs, full 7 across
  { cols:7, items:[
      { pos:"WR-SL", col:2 },
      { pos:"RB",    col:3 },
      { pos:"QB",    col:4 },   // directly behind center
      { pos:"TE",    col:6 }
    ]}
];
const SPECIAL_ROW = { cols:7, items:["PT","PK","KO","LS","H","PR","KR"] };

async function loadData(){
  const res = await fetch('depth_chart_data.json?v=' + Date.now());
  const raw = await res.json();
  DATA = raw;
  init();
}

function fmtTimestamp(iso){
  if(!iso) return null;
  const d = new Date(iso);
  if(isNaN(d.getTime())) return null;
  const datePart = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const timePart = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  return `${datePart}, ${timePart}`;
}

function renderStatus(){
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  if(!DATA.rows || !DATA.rows.length){
    dot.className = 'dot warn';
    statusText.textContent = 'No data loaded yet.';
    return;
  }
  dot.className = 'dot ok';
  const ts = fmtTimestamp(DATA.generatedAt);
  const parts = [`${DATA.team || 'Team'} · ${DATA.rows.length} depth chart spots`];
  if(ts) parts.push(`updated ${ts}`);
  statusText.textContent = parts.join(' · ');
}

let state = { search: "" };
const searchBox = document.getElementById("searchBox");

function init(){
  renderStatus();
  const teamSelect = document.getElementById('teamSelect');
  teamSelect.innerHTML = `<option>${DATA.team || 'Team'}</option>`;
  searchBox.addEventListener("input", () => { state.search = searchBox.value.toLowerCase(); render(); });
  render();
}

function slotHtml(r, isStarter){
  const badge = r.isTransfer ? '<span class="badge tr">TR</span>'
              : (r.class && r.class.toUpperCase() === 'FR') ? '<span class="badge fr">FR</span>' : '';
  let rankLine;
  if(r.isTransfer){
    rankLine = r.transferRank != null
      ? `247: ${r.compositeScore ?? '—'} · Transfer #${r.transferRank} (POS #${r.transferPosRank ?? '—'})`
      : `247: ${r.compositeScore ?? '—'} · transfer rank pending`;
  } else {
    rankLine = r.hsNationalRank != null
      ? `247: ${r.compositeScore ?? '—'} · #${r.hsNationalRank} natl (POS #${r.hsPositionRank ?? '—'})`
      : `247: ${r.compositeScore ?? '—'}`;
  }
  return `
    <div class="slot ${isStarter ? 'starter' : ''}">
      <div class="l1"><span class="num">${r.jersey || ''}</span> ${r.player}${badge}</div>
      <div class="l2">${r.class || ''} · ${rankLine}</div>
      <div class="l3 pff">PFF: —</div>
    </div>`;
}

function posBoxHtml(pos, groups, gridColumn){
  const list = groups[pos];
  if(!list || !list.length) return "";
  const slots = list.map((r,i) => slotHtml(r, i===0)).join('');
  const style = gridColumn ? ` style="grid-column:${gridColumn} / span 1;"` : "";
  return `<div class="posbox"${style}><div class="hd">${pos}</div>${slots}</div>`;
}

function rowHtml(row, groups){
  const { cols, items } = row;
  // normalize: plain strings get auto-centered as a contiguous block; objects get pinned columns
  const isExplicit = items.length && typeof items[0] === "object";
  let placed;
  if(isExplicit){
    placed = items
      .filter(it => groups[it.pos] && groups[it.pos].length)
      .map(it => posBoxHtml(it.pos, groups, it.col));
  } else {
    const present = items.filter(pos => groups[pos] && groups[pos].length);
    const start = Math.floor((cols - present.length) / 2) + 1;
    placed = present.map((pos, i) => posBoxHtml(pos, groups, start + i));
  }
  const boxesHtml = placed.filter(Boolean).join('');
  if(!boxesHtml) return "";
  return `<div class="formrow" style="grid-template-columns:repeat(${cols}, 1fr);">${boxesHtml}</div>`;
}

function sectionHtml(title, scheme, rows, groups){
  const rowsHtml = rows.map(row => rowHtml(row, groups)).join('');
  if(!rowsHtml.trim()) return "";
  return `
    <div class="section-head"><h2>${title}</h2><span class="scheme">${scheme}</span></div>
    ${rowsHtml}`;
}

function render(){
  const q = state.search;
  const rows = DATA.rows.filter(r => !q || r.player.toLowerCase().includes(q));
  const container = document.getElementById("chartBody");
  const emptyState = document.getElementById("emptyState");

  if(!rows.length){
    container.innerHTML = "";
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";

  const groups = {};
  rows.forEach(r => { (groups[r.position] = groups[r.position] || []).push(r); });

  let html = "";
  html += sectionHtml("Defense", "4-2-5", DEFENSE_ROWS, groups);
  html += sectionHtml("Offense", "Spread Option", OFFENSE_ROWS, groups);
  html += sectionHtml("Specialists", "", [SPECIAL_ROW], groups);

  container.innerHTML = html;
}

loadData();
</script>
</body>
</html>
