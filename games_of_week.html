const SPREAD_WEIGHT = 1.0;

function coloredName(name, colorMap){
  const c = colorMap[name];
  if(!c) return name;
  return `<span style="background:${c.primary}; color:#fff; padding:1px 7px; border-radius:4px; border:2px solid ${c.secondary}; font-weight:700; white-space:nowrap; display:inline-block;">${name}</span>`;
}

// AP/committee rank is only meaningful for CFB (NFL has no such poll) --
// APRankings gets populated only when rendering the CFB section, so this
// silently does nothing for NFL games.
let APRankings = {};
function rankSup(rank){
  return `<sup style="color:#fff; font-style:italic; font-weight:700;">#${rank}</sup>`;
}

function awayNameWithRank(name, colorMap){
  const rank = APRankings[name];
  const rankHtml = rank ? rankSup(rank) + ' ' : '';
  return rankHtml + coloredName(name, colorMap);
}

function homeNameWithRank(name, colorMap){
  const rank = APRankings[name];
  const rankHtml = rank ? ' ' + rankSup(rank) : '';
  return coloredName(name, colorMap) + rankHtml;
}

function formatGameTime(isoString){
  if(!isoString) return '—';
  const d = new Date(isoString);
  const dayTime = d.toLocaleString('en-US', {
    weekday: 'short', month: 'numeric', day: 'numeric',
    hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
  });
  return dayTime;
}

function gameScore(g){
  const combined = (g.homeRating || 0) + (g.awayRating || 0);
  const spreadPenalty = SPREAD_WEIGHT * Math.abs(g.vegasSpread != null ? g.vegasSpread : (g.modelSpread || 0));
  return combined - spreadPenalty;
}

function currentWeek(games){
  const upcoming = games.filter(g => g.status !== "final").map(g => g.week);
  if(upcoming.length) return Math.min(...upcoming);
  const allWeeks = games.map(g => g.week);
  return allWeeks.length ? Math.max(...allWeeks) : null;
}

function fmtSpreadTeam(g, spread){
  // spread is home-perspective: positive = home favored, negative = away
  // favored. Confirmed real bug this replaces: g.pick is the model's own
  // betting-value recommendation (which side has edge against the market),
  // NOT necessarily who is actually favored to win -- pairing it with the
  // spread magnitude produced wrong output like "Tulane -7.5" for a game
  // where Vegas actually favored Duke by 7.5, because the model recommended
  // betting Tulane as the value side while still expecting Duke to win.
  if(spread == null) return '—';
  if(spread === 0) return "Pick'em";
  const favTeam = spread > 0 ? g.homeTeam : g.awayTeam;
  return `${favTeam} -${Math.abs(spread).toFixed(1)}`;
}

// WMO weather codes, per Open-Meteo's documented convention
const WMO_CODES = {
  0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast",
  45: "Fog", 48: "Fog",
  51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
  61: "Light rain", 63: "Rain", 65: "Heavy rain",
  71: "Light snow", 73: "Snow", 75: "Heavy snow",
  80: "Rain showers", 81: "Rain showers", 82: "Heavy rain showers",
  95: "Thunderstorm", 96: "Thunderstorm", 99: "Severe thunderstorm",
};

let weatherByGameId = {};

function weatherHtml(g){
  const w = weatherByGameId[String(g.gameId)];
  if(!w || g.dome) return '';
  const desc = WMO_CODES[w.weatherCode] || '';
  const parts = [];
  if(w.temperatureF != null) parts.push(`${Math.round(w.temperatureF)}°F`);
  if(desc) parts.push(desc);
  if(w.precipitationProbability != null && w.precipitationProbability >= 20) parts.push(`${w.precipitationProbability}% precip`);
  if(w.windSpeedMph != null && w.windSpeedMph >= 15) parts.push(`${Math.round(w.windSpeedMph)} mph wind`);
  return parts.length ? `<div class="meta">${parts.join(' · ')}</div>` : '';
}

function depthChartPath(teamDisplayName, league, game){
  if(league === "nfl"){
    const abbr = (teamDisplayName === game.homeTeam ? game.homeAbbr : game.awayAbbr);
    return abbr ? `depth_chart_data_nfl/${abbr.toLowerCase()}.json` : null;
  }
  const key = CFB_DISPLAY_TO_KEY[teamDisplayName];
  return key ? `depth_chart_data/${key}.json` : null;
}

async function fetchDepthChart(path){
  if(!path) return null;
  if(depthChartCache[path]) return depthChartCache[path];
  try{
    const res = await fetch(path + '?v=' + Date.now());
    const data = await res.json();
    depthChartCache[path] = data;
    return data;
  } catch(e){
    return null;
  }
}

// Best available rating for a player, trying the most rigorous source
// first and falling back -- not perfectly apples-to-apples across
// different scales, but a reasonable "how notable is this player" signal
// given what data actually exists for them.
function gameRating(row){
  // CFB27 rating for CFB rows, Madden27 for NFL rows -- a given row only
  // ever has one or the other, never both, so this is safe either way.
  if(row.cfb27Rating != null) return row.cfb27Rating;
  if(row.madden27Rating != null) return row.madden27Rating;
  return null;
}

// Selection priority: draft rank first (a real 2027 draft prospect always
// outranks a non-prospect), with a lower rank number (closer to #1) beating
// a higher one among prospects. Everyone else is sorted by CFB27/Madden
// rating. PFF grade is intentionally NOT part of this -- it's shown as
// display info on the card, not used to decide who gets selected.
function comparePlayers(a, b){
  const aDraft = a.draftRank, bDraft = b.draftRank;
  if(aDraft != null && bDraft != null) return aDraft - bDraft;
  if(aDraft != null) return -1;
  if(bDraft != null) return 1;
  const aRating = gameRating(a), bRating = gameRating(b);
  if(aRating == null && bRating == null) return 0;
  if(aRating == null) return 1;
  if(bRating == null) return -1;
  return bRating - aRating;
}

const OL_POSITIONS = new Set(["LT", "RT", "LG", "RG", "C", "T", "G"]);
const SPECIALIST_KEYWORDS = ["K", "P", "LS", "KR", "PR"];
const DEFENSE_KEYWORDS = ["DE", "DT", "DL", "LB", "CB", "FS", "SS", "NB", "JACK", "EDGE"];

function isOffenseSkill(position){
  if(!position) return false;
  if(position === "QB") return false;
  if(OL_POSITIONS.has(position)) return false;
  if(SPECIALIST_KEYWORDS.includes(position)) return false;
  return /WR|TE|HB|RB|FB/.test(position);
}

function isDefense(position){
  if(!position) return false;
  return DEFENSE_KEYWORDS.some(kw => position.includes(kw));
}

function findStarterAtPosition(rows, matchFn){
  // Depth chart rows are listed starter-first within each position group
  // (matching Ourlads' own ordering), so the first non-reserve match is
  // the starter.
  return rows.find(r => matchFn(r.position) && !r.isReserve) || null;
}

function topByRating(rows, matchFn, count, exclude){
  const excludeSet = new Set(exclude || []);
  return rows
    .filter(r => matchFn(r.position) && !r.isReserve && !excludeSet.has(r.player) &&
                 (r.draftRank != null || gameRating(r) != null))
    .sort(comparePlayers)
    .slice(0, count);
}

function playerLineHtml(row){
  if(!row) return `<div class="pw-player pw-empty-slot">—</div>`;
  const rating = gameRating(row);
  const ratingText = rating != null ? rating.toFixed(1) : '—';
  const recruitStars = starsForComposite(row.compositeScore);
  const draftRankText = row.draftRank ? ` · <span style="color:#87CEEB; font-weight:700;">Draft Rank #${row.draftRank}</span>` : '';
  let pffText = '';
  if(row.pffGrade != null){
    pffText = ` · PFF: ${row.pffGrade.toFixed(1)}`;
    if(row.pffPositionRank != null && row.pffPositionTotal != null){
      pffText += ` (Ranked ${row.pffPositionRank}${row.pffTied ? 'T' : ''} of ${row.pffPositionTotal})`;
    }
  }
  return `
    <div class="pw-player">
      <div class="pw-name">${row.player} <span class="pw-pos">${row.position || ''}</span></div>
      <div class="pw-meta">${row.class || ''} · Rating: ${ratingText}${recruitStars ? ' · Recruit: ' + recruitStars : ''}${pffText}${draftRankText}</div>
    </div>`;
}

function starsForComposite(score){
  if(score == null) return '';
  if(score >= 95) return '★★★★★';
  if(score >= 85) return '★★★★';
  if(score >= 75) return '★★★';
  if(score >= 65) return '★★';
  if(score >= 50) return '★';
  return '';
}

function teamPicks(rows){
  const qb = findStarterAtPosition(rows, p => p === "QB");
  const exclude = qb ? [qb.player] : [];
  const offense = topByRating(rows, isOffenseSkill, 2, exclude);
  const defense = topByRating(rows, isDefense, 3, exclude);
  return [qb, ...offense, ...defense];
}

async function loadPlayersToWatch(gameId, homeTeam, awayTeam, league, game){
  const container = document.getElementById(`pw-content-${gameId}`);
  if(!container) return;
  container.innerHTML = `<div class="pw-loading">Loading players…</div>`;

  const [homeData, awayData] = await Promise.all([
    fetchDepthChart(depthChartPath(homeTeam, league, game)),
    fetchDepthChart(depthChartPath(awayTeam, league, game)),
  ]);

  const homeRows = (homeData && homeData.rows) || [];
  const awayRows = (awayData && awayData.rows) || [];

  // Each team gets its own independent 6: QB + top 2 offense + top 3
  // defense from that team's own roster -- not pooled across both teams,
  // so both columns always show the same consistent count.
  const homePicks = teamPicks(homeRows);
  const awayPicks = teamPicks(awayRows);

  const homeHtml = homePicks.map(playerLineHtml).join("");
  const awayHtml = awayPicks.map(playerLineHtml).join("");

  container.innerHTML = `
    <div class="pw-cols">
      <div class="pw-col">
        <div class="pw-col-head">${awayTeam}</div>
        ${awayHtml}
      </div>
      <div class="pw-col">
        <div class="pw-col-head">${homeTeam}</div>
        ${homeHtml}
      </div>
    </div>`;
}

let gameLookupById = {};

function togglePlayersToWatch(gameId, homeTeam, awayTeam, league){
  const content = document.getElementById(`pw-content-${gameId}`);
  const arrow = document.getElementById(`pw-arrow-${gameId}`);
  if(!content) return;
  const isOpen = content.style.display === "block";
  content.style.display = isOpen ? "none" : "block";
  if(arrow) arrow.textContent = isOpen ? "▾" : "▴";
  if(!isOpen && !content.dataset.loaded){
    content.dataset.loaded = "1";
    const game = gameLookupById[gameId];
    loadPlayersToWatch(gameId, homeTeam, awayTeam, league, game);
  }
}

function gameCardHtml(g, listPosition, colorMap, league){
  const spread = g.vegasSpread != null ? g.vegasSpread : g.modelSpread;
  const spreadText = fmtSpreadTeam(g, spread);
  const location = g.venueCity ? `${g.venue || ''} · ${g.venueCity}${g.venueState ? ', ' + g.venueState : ''}` : (g.venue || null);
  gameLookupById[g.gameId] = g;
  return `
    <div class="game-card">
      <div class="matchup"><span class="rank-num">${listPosition}.</span>${awayNameWithRank(g.awayTeam, colorMap)} @ ${homeNameWithRank(g.homeTeam, colorMap)}</div>
      <div class="meta">${formatGameTime(g.startDate)}</div>
      ${location ? `<div class="meta">${location}</div>` : ''}
      ${weatherHtml(g)}
      <div class="meta">Spread: <span class="spread">${spreadText}</span></div>
      <div class="pw-toggle" onclick="togglePlayersToWatch('${g.gameId}', '${g.homeTeam.replace(/'/g, "\\'")}', '${g.awayTeam.replace(/'/g, "\\'")}', '${league}')">
        Players to Watch <span id="pw-arrow-${g.gameId}">▾</span>
      </div>
      <div class="pw-content" id="pw-content-${g.gameId}" style="display:none;"></div>
    </div>`;
}

function sectionHtml(title, games, colorMap, count, league){
  if(!games.length){
    return `<div class="section-head"><h2>${title}</h2></div><div class="empty">No games scheduled this week.</div>`;
  }
  const scored = games.map(g => ({ g, score: gameScore(g) }));
  scored.sort((a, b) => b.score - a.score);
  const top = scored.slice(0, count);
  const cardsHtml = top.map((item, i) => gameCardHtml(item.g, i + 1, colorMap, league)).join("");
  return `<div class="section-head"><h2>${title}</h2></div>${cardsHtml}`;
}

async function loadData(){
  try{
    const [cfbRes, nflRes, brrRes] = await Promise.all([
      fetch('lines_data.json?v=' + Date.now()),
      fetch('lines_data_nfl.json?v=' + Date.now()),
      fetch('brr_data.json?v=' + Date.now())
    ]);
    const cfbRaw = await cfbRes.json();
    const nflRaw = await nflRes.json();
    const brrRaw = await brrRes.json();
    const cfbGames = Array.isArray(cfbRaw) ? cfbRaw : (cfbRaw.games || []);
    const nflGames = Array.isArray(nflRaw) ? nflRaw : (nflRaw.games || []);
    const brrRows = Array.isArray(brrRaw) ? brrRaw : (brrRaw.rows || []);

    // Weather is a nice-to-have on top of the core page -- fetched
    // separately so a missing/failed weather file never breaks the rest.
    try{
      const weatherRes = await fetch('games_weather.json?v=' + Date.now());
      const weatherRaw = await weatherRes.json();
      weatherByGameId = weatherRaw.weather || {};
    } catch(e){
      weatherByGameId = {};
    }

    const cfbWeek = currentWeek(cfbGames);
    const nflWeek = currentWeek(nflGames);

    const cfbThisWeek = cfbGames.filter(g => g.week === cfbWeek);
    const nflThisWeek = nflGames.filter(g => g.week === nflWeek);

    document.getElementById('statusText').textContent =
      `College Football Week ${cfbWeek || '—'} · NFL Week ${nflWeek || '—'}`;

    // AP/committee rank only applies to CFB -- build the lookup from the
    // most recent season present in brr_data.json, keyed by team name.
    const latestYear = brrRows.length ? Math.max(...brrRows.map(r => r.year)) : null;
    APRankings = {};
    brrRows.filter(r => r.year === latestYear).forEach(r => { APRankings[r.team] = r.rank; });

    const cfbHtml = sectionHtml("Top 10 College Football Games", cfbThisWeek, CFB_TEAM_COLORS, 10, "cfb");
    APRankings = {};  // NFL has no such poll -- clear so awayNameWithRank/homeNameWithRank are no-ops for the NFL section
    const nflHtml = sectionHtml("Top 5 NFL Games", nflThisWeek, NFL_TEAM_COLORS, 5, "nfl");
    document.getElementById('content').innerHTML =
      `<div class="two-col"><div>${cfbHtml}</div><div>${nflHtml}</div></div>`;
  } catch(e){
    document.getElementById('statusText').textContent = 'Failed to load data';
    document.getElementById('statusDot').style.background = '#D46A6A';
  }
}

loadData();
</script>
