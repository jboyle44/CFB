name: Update NFL Depth Chart Data

on:
  schedule:
    # Tuesday and Friday 9am ET (13:00 UTC during EDT/daylight saving; will
    # read as 8am ET once clocks fall back to EST in November unless updated).
    - cron: '0 13 * * 2'
    - cron: '0 13 * * 5'

  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    # Serialize every job that writes NFL depth chart files.
    # Never cancel: a queued run must still execute after the one ahead of it.
    concurrency:
      group: depth-data-nfl
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Latest main at job start, not the commit that existed when the
          # schedule fired. A run that waited in the concurrency queue must
          # build on whatever the run ahead of it pushed.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run NFL depth chart scraper for every configured team
        working-directory: scripts
        run: |
          set +e
          mkdir -p ../depth_chart_data_nfl
          : > ../depth_chart_scrape_log_nfl.txt
          TEAMS=$(python3 -c "from teams_config_nfl import NFL_TEAMS; print(' '.join(NFL_TEAMS.keys()))")
          for team in $TEAMS; do
            echo "=== $team ===" >> ../depth_chart_scrape_log_nfl.txt
            python build_depth_chart_nfl.py "$team" "../depth_chart_data_nfl/${team}.json" >> ../depth_chart_scrape_log_nfl.txt 2>&1
            echo "exit_code=$?" >> ../depth_chart_scrape_log_nfl.txt
          done
          cat ../depth_chart_scrape_log_nfl.txt

      - name: Commit and push if data changed
        run: |
          git config user.name "depth-chart-bot"
          git config user.email "actions@github.com"
          scripts/push_depth_data.sh ours \
            "Weekly NFL depth chart update - $(date -u +%Y-%m-%d)" \
            depth_chart_data_nfl depth_chart_scrape_log_nfl.txt
