name: Update NFL Depth Chart Data

on:
  schedule:
    # Tuesday and Friday 9am ET (13:00 UTC during EDT/daylight saving; will
    # read as 8am ET once clocks fall back to EST in November unless updated).
    - cron: '0 13 * * 2'
    - cron: '0 13 * * 5'

  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run NFL depth chart scraper for every configured team
        working-directory: scripts
        run: |
          set +e
          mkdir -p ../depth_chart_data_nfl
          : > ../depth_chart_scrape_log_nfl.txt
          TEAMS=$(python3 -c "from teams_config_nfl import NFL_TEAMS; print(' '.join(NFL_TEAMS.keys()))")
          for team in $TEAMS; do
            echo "=== $team ===" >> ../depth_chart_scrape_log_nfl.txt
            python build_depth_chart_nfl.py "$team" "../depth_chart_data_nfl/${team}.json" >> ../depth_chart_scrape_log_nfl.txt 2>&1
            echo "exit_code=$?" >> ../depth_chart_scrape_log_nfl.txt
          done
          cat ../depth_chart_scrape_log_nfl.txt

      - name: Commit and push if data changed
        run: |
          git config user.name "depth-chart-bot"
          git config user.email "actions@github.com"
          git add depth_chart_data_nfl/ depth_chart_scrape_log_nfl.txt
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Weekly NFL depth chart update - $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- rebasing onto latest main and retrying."
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
