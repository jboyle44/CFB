name: Build Big Ten Only

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Build Big Ten teams
        working-directory: scripts
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python3 build_b10.py
      - name: Commit and push
        run: |
          git config user.name "b10-build-bot"
          git config user.email "actions@github.com"
          git add depth_chart_data/illinois.json depth_chart_data/indiana.json depth_chart_data/iowa.json \
                  depth_chart_data/maryland.json depth_chart_data/michigan.json depth_chart_data/michigan-state.json \
                  depth_chart_data/minnesota.json depth_chart_data/nebraska.json depth_chart_data/northwestern.json \
                  depth_chart_data/ohio-state.json depth_chart_data/oregon.json depth_chart_data/penn-state.json \
                  depth_chart_data/purdue.json depth_chart_data/rutgers.json depth_chart_data/ucla.json \
                  depth_chart_data/usc.json depth_chart_data/washington.json depth_chart_data/wisconsin.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Build Big Ten with reserves merge"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
