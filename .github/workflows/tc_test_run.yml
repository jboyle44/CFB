name: Test TeamCrafters Ratings

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Test teamcrafters scraper
        working-directory: scripts
        run: python3 test_tc_script.py
      - name: Commit result
        run: |
          git config user.name "test-bot"
          git config user.email "actions@github.com"
          git add test_tc_result.json
          git commit -m "Test result" || echo "nothing to commit"
          git push
