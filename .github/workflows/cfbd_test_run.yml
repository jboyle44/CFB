name: Test CFBD Recruiting API

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Test CFBD recruiting + transfer portal API
        working-directory: scripts
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python3 test_cfbd_script2.py

      - name: Commit result
        run: |
          git config user.name "test-bot"
          git config user.email "actions@github.com"
          git add test_cfbd_result.json
          git commit -m "Test result" || echo "nothing to commit"
          git push
