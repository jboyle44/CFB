name: Test Position Scrape
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - working-directory: scripts
        run: python3 test_position_scrape.py
      - run: |
          git config user.name "test-bot"
          git config user.email "actions@github.com"
          git add position_test_result.txt
          git commit -m "Test result" || echo "nothing to commit"
          git push
