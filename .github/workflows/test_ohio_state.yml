name: Test Ohio State Rebuild 2

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Rebuild Ohio State with tracing
        working-directory: scripts
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python3 test_ohio_state.py 2> ../oh_state_debug.txt
      - name: Commit result
        run: |
          git config user.name "test-bot"
          git config user.email "actions@github.com"
          git add depth_chart_data/ohio-state.json oh_state_debug.txt
          git commit -m "Test Ohio State rebuild with debug" || echo "nothing to commit"
          git push
