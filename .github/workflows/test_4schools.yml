name: Test 4 Schools

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Rebuild 4 teams
        working-directory: scripts
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python3 test_4schools.py
      - name: Commit result
        run: |
          git config user.name "test-bot"
          git config user.email "actions@github.com"
          git add depth_chart_data/ohio-state.json depth_chart_data/oregon.json depth_chart_data/texas.json depth_chart_data/indiana.json
          git commit -m "Test 4-school multi-hop fix" || echo "nothing to commit"
          git push
