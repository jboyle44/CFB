name: Diagnostic DFI 2

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run real command with traceback
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/weekly_lines_update.py 2> dfi_diag2_stderr.txt || echo "exit_code=$?" >> dfi_diag2_stderr.txt
      - name: Commit result
        run: |
          git config user.name "test-bot"
          git config user.email "actions@github.com"
          git add dfi_diag2_stderr.txt
          git commit -m "Diagnostic result" || echo "nothing to commit"
          git push
