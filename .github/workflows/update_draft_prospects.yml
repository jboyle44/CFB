name: Update Draft Prospects

on:
  schedule:
    - cron: '0 13 * * 2'  # Tuesday 9am ET (EDT)
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    # Serialize every job that writes CFB depth chart files.
    # Never cancel: a queued run must still execute after the one ahead of it.
    concurrency:
      group: depth-data-cfb
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Latest main at job start, not the commit that existed when the
          # schedule fired. A run that waited in the concurrency queue must
          # build on whatever the run ahead of it pushed.
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run draft prospects scraper
        working-directory: scripts
        run: python3 build_draft_prospects.py ../draft_prospects.json
      - name: Merge draft ranks into depth chart data
        working-directory: scripts
        run: python3 merge_draft_ranks.py ../draft_prospects.json ../depth_chart_data
      - name: Commit and push if data changed
        run: |
          git config user.name "draft-prospects-bot"
          git config user.email "actions@github.com"
          scripts/push_depth_data.sh theirs \
            "Weekly draft prospects update - $(date -u +%Y-%m-%d)" \
            depth_chart_data draft_prospects.json
