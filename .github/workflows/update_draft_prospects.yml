name: Update Draft Prospects

on:
  schedule:
    - cron: '0 13 * * 2'  # Tuesday 9am ET (EDT)
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run draft prospects scraper
        working-directory: scripts
        run: python3 build_draft_prospects.py ../draft_prospects.json
      - name: Commit and push if data changed
        run: |
          git config user.name "draft-prospects-bot"
          git config user.email "actions@github.com"
          git add draft_prospects.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Weekly draft prospects update - $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- rebasing onto latest main and retrying."
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
