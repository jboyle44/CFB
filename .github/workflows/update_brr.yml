name: Update BRR Data

on:
  schedule:
    # One-time: Tuesday, Sept 8, 2026 at 9am ET (13:00 UTC).
    # Labor Day pushed Week 1's AP poll release to Tuesday this week only.
    # Safe to delete this line after Sept 8 -- it won't fire again (month +
    # day-of-month are both pinned, so it only ever matches Sept 8).
    - cron: '0 13 8 9 *'

    # Ongoing: two runs a week, timed around when the actual ranking
    # sources update --
    #   - AP Poll releases Sundays ~2pm ET -> Sunday 5pm ET (21:00 UTC)
    #     gives a 3-hour buffer for any delay.
    #   - SP+ (Bill Connelly, ESPN) updates Tuesday mornings, and the CFP
    #     committee's own ranking (once released, ~week 10-13 onward)
    #     drops Tuesday nights ~7pm ET -- one late-Tuesday run catches
    #     both. Wednesday 01:00 UTC = Tuesday 9pm EDT / 8pm EST, a
    #     2-3 hour buffer after the committee's release.
    - cron: '0 21 * * 0'
    - cron: '0 1 * * 3'

  # Lets you (or me, walking you through it) trigger a run manually from the
  # Actions tab any time, without waiting for the schedule -- useful for
  # testing.
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run weekly update
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/weekly_update.py

      - name: Commit and push if data changed
        run: |
          git config user.name "brr-bot"
          git config user.email "actions@github.com"
          git add brr_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly BRR update - $(date -u +%Y-%m-%d)"
            git push
          fi
