name: CBB Fetch History

on:
  workflow_dispatch:

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'install.packages(c("data.table","jsonlite","R.utils"), repos="https://packagemanager.posit.co/cran/__linux__/noble/latest")'
      - name: Fetch history
        run: Rscript cbb/scripts/fetch_history.R
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cbb/raw
          git commit -m "CBB: fetch mirrored CBBD history" || echo "no changes"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
