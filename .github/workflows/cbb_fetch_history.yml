name: CBB Fetch History

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Season range, e.g. 2014-2026 (CBBD season = spring year)"
        default: "2014-2026"
      max_calls:
        description: "Hard ceiling on CBBD API calls (shared CFBD quota)"
        default: "250"

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch history
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASONS: ${{ inputs.seasons }}
          MAX_CALLS: ${{ inputs.max_calls }}
        run: python cbb/scripts/fetch_cbbd_history.py
      - name: Record remaining quota
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          curl -s "https://api.collegefootballdata.com/info" -H "Authorization: Bearer ${CFBD_API_KEY}" > cfbd_usage_result.json
          echo "Checked at: $(date -u)" >> cfbd_usage_result.json
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add cbb/raw cfbd_usage_result.json
          git commit -m "CBB: backfill CBBD team box + lines" || echo "no changes"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
