name: Update CFB Lines

on:
  schedule:
    # Sunday at 3pm ET (19:00 UTC) and Thursday at 9am ET (13:00 UTC).
    - cron: '0 19 * * 0'
    - cron: '0 13 * * 4'

  # Trigger a run manually from the Actions tab any time.
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run weekly lines update
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/weekly_lines_update.py

      - name: Commit and push if data changed
        run: |
          git config user.name "brr-bot"
          git config user.email "actions@github.com"
          git add lines_data.json ratings_history.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "CFB lines/ratings update - $(date -u +%Y-%m-%d)"
            git push
          fi
