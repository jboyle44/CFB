name: Update Video Game Ratings (CFB27 / Madden27)

on:
  schedule:
    # Monthly refreshes, kept off Tuesday/Friday mornings when the depth chart,
    # NFL depth chart and draft prospects workflows run against the same files.
    # Nov 4 (Wed), 9am ET (14:00 UTC, EST after clocks fall back Nov 1) -- both games
    - cron: '0 14 4 11 *'
    # Dec 2 (Wed), 9am ET (14:00 UTC, EST) -- both games
    - cron: '0 14 2 12 *'
    # Jan 6 (Wed), 9am ET (14:00 UTC, EST) -- NFL/Madden only
    - cron: '0 14 6 1 *'

  workflow_dispatch: {}

jobs:
  update-cfb27:
    # Runs for every trigger except the Jan 6 NFL-only schedule.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '0 14 6 1 *'
    runs-on: ubuntu-latest
    # Serialize every job that writes CFB depth chart files.
    # Never cancel: a queued run must still execute after the one ahead of it.
    concurrency:
      group: depth-data-cfb
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Latest main at job start, not the commit that existed when the
          # schedule fired. A run that waited in the concurrency queue must
          # build on whatever the run ahead of it pushed.
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Update CFB27 ratings
        working-directory: scripts
        run: python3 update_video_game_ratings.py ../depth_chart_data
      - name: Commit and push if data changed
        run: |
          git config user.name "video-game-ratings-bot"
          git config user.email "actions@github.com"
          git add depth_chart_data/
          if git diff --staged --quiet; then
            echo "No CFB27 rating changes to commit."
            exit 0
          fi
          scripts/push_depth_data.sh theirs \
            "CFB27 ratings update - $(date -u +%Y-%m-%d)" \
            depth_chart_data

  update-madden27:
    # Runs on every trigger, including the Jan 6 NFL-only schedule.
    runs-on: ubuntu-latest
    # Serialize every job that writes NFL depth chart files.
    # Never cancel: a queued run must still execute after the one ahead of it.
    concurrency:
      group: depth-data-nfl
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Latest main at job start, not the commit that existed when the
          # schedule fired. A run that waited in the concurrency queue must
          # build on whatever the run ahead of it pushed.
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Update Madden27 ratings
        working-directory: scripts
        run: python3 update_video_game_ratings_nfl.py ../depth_chart_data_nfl
      - name: Commit and push if data changed
        run: |
          git config user.name "video-game-ratings-bot"
          git config user.email "actions@github.com"
          git add depth_chart_data_nfl/
          if git diff --staged --quiet; then
            echo "No Madden27 rating changes to commit."
            exit 0
          fi
          scripts/push_depth_data.sh theirs \
            "Madden27 ratings update - $(date -u +%Y-%m-%d)" \
            depth_chart_data_nfl
