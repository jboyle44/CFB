name: Update Depth Chart Data

on:
  schedule:
    # Ourlads and CollegeFootballData.com both update rolling through the week
    # rather than on one fixed day, so this runs on the same cadence as the
    # DFI-CFB scripts:
    # Sunday ~noon ET (16:00 UTC) and Tuesday ~10am ET (14:00 UTC).
    - cron: '0 16 * * 0'
    - cron: '0 14 * * 2'

  # Trigger a run manually from the Actions tab any time, without waiting for
  # the schedule -- useful for testing after changes to the scraper.
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run depth chart scraper for every configured team
        working-directory: scripts
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          set +e
          mkdir -p ../depth_chart_data
          : > ../depth_chart_scrape_log.txt
          TEAMS=$(python3 -c "from teams_config import TEAMS; print(' '.join(TEAMS.keys()))")
          for team in $TEAMS; do
            echo "=== $team ===" >> ../depth_chart_scrape_log.txt
            python build_depth_chart.py "$team" "../depth_chart_data/${team}.json" >> ../depth_chart_scrape_log.txt 2>&1
            echo "exit_code=$?" >> ../depth_chart_scrape_log.txt
          done
          cat ../depth_chart_scrape_log.txt

      - name: Commit and push if data changed
        run: |
          git config user.name "depth-chart-bot"
          git config user.email "actions@github.com"
          git add depth_chart_data/ depth_chart_scrape_log.txt
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Weekly depth chart update - $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- rebasing onto latest main and retrying."
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
