name: Update Depth Chart Data

on:
  schedule:
    # Tuesday and Friday 9am ET (13:00 UTC during EDT/daylight saving; will
    # read as 8am ET once clocks fall back to EST in November unless updated).
    - cron: '0 13 * * 2'
    - cron: '0 13 * * 5'

  # Trigger a run manually from the Actions tab any time, without waiting for
  # the schedule -- useful for testing after changes to the scraper.
  workflow_dispatch:
    inputs:
      skip_cfbd:
        description: "Refresh rosters without any CFBD calls (carry forward existing CFBD data)"
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Serialize every job that writes CFB depth chart files.
    # Never cancel: a queued run must still execute after the one ahead of it.
    concurrency:
      group: depth-data-cfb
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Latest main at job start, not the commit that existed when the
          # schedule fired. A run that waited in the concurrency queue must
          # build on whatever the run ahead of it pushed.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run depth chart scraper for every configured team
        working-directory: scripts
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          # Shared across the per-team processes so each CFBD response is
          # fetched at most once per run (see scrape_cfbd_recruiting.py).
          CFBD_CACHE_DIR: ${{ runner.temp }}/cfbd_cache
          CFBD_SKIP: ${{ inputs.skip_cfbd && '1' || '0' }}
        run: |
          set +e
          mkdir -p ../depth_chart_data
          : > ../depth_chart_scrape_log.txt
          TEAMS=$(python3 -c "from teams_config import TEAMS; print(' '.join(TEAMS.keys()))")
          for team in $TEAMS; do
            echo "=== $team ===" >> ../depth_chart_scrape_log.txt
            python build_depth_chart.py "$team" "../depth_chart_data/${team}.json" >> ../depth_chart_scrape_log.txt 2>&1
            echo "exit_code=$?" >> ../depth_chart_scrape_log.txt
          done
          cat ../depth_chart_scrape_log.txt

      - name: Commit and push if data changed
        run: |
          git config user.name "depth-chart-bot"
          git config user.email "actions@github.com"
          scripts/push_depth_data.sh ours \
            "Weekly depth chart update - $(date -u +%Y-%m-%d)" \
            depth_chart_data depth_chart_scrape_log.txt
