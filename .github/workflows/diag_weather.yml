name: Diagnostic Weather
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - working-directory: scripts
        run: python3 diag_weather.py
      - run: |
          git config user.name "test-bot"
          git config user.email "actions@github.com"
          git add weather_diag.txt
          git commit -m "Diagnostic" || echo "nothing to commit"
          git push
