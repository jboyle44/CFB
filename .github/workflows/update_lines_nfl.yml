name: Update NFL DFI Lines

on:
  schedule:
    # Tuesday and Friday at 9am ET (13:00 UTC) -- catches early-week lines
    # and the pre-weekend line moves (injury reports, etc.) that the old
    # Sun/Tue schedule missed. Every game still falls inside the free
    # scores API's 3-day lookback: Thursday-night games get graded by the
    # Friday run, Sun/Mon games by the following Tuesday run.
    - cron: '0 13 * * 2'
    - cron: '0 13 * * 5'

  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run weekly NFL DFI update
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/weekly_lines_update_nfl.py

      - name: Commit and push if data changed
        run: |
          git config user.name "brr-bot"
          git config user.email "actions@github.com"
          git add lines_data_nfl.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NFL DFI lines update - $(date -u +%Y-%m-%d)"
            git push
          fi
